[package]
name = "valar-core"
license = "MIT"
description = "Open source authentication framework for Rust developers"
readme = "README.md"
homepage = "https://github.com/codetheproject/codora-framework"
documentation = "https://docs.rs/codora-framework"
repository = "https://github.com/codetheproject/codora-framework"
keywords = ["web", "server", "orm", "authentication", "security"]
categories = ["web-programming", "database", "authentication"]
authors = ["West Sheriff <west.sh.mail@gmail.com>"]
edition = { workspace = true }

[features]
default = ["full"]
# You probably don’t want to enable “full” mode directly, it exists only for testing and CI.
full = ["authorization", "cookie", "jwt", "bearer", "identity"]
authorization = []
cookie = []
bearer = []
jwt = []
identity = ["authorization"]


[dependencies]
http = "1.3.1"
thiserror = { workspace = true }
tower-service = { workspace = true }
tower-layer = "0.3.3"
tower = { workspace = true, features = ["util"] }
derive-new = { workspace = true }
tracing = { workspace = true }
paste = "1.0.15"

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
